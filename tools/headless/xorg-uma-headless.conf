# Headless X server (:1) on the NVIDIA GPU, for playing the game in the background.
#
# Started by tools/headless/start-display.sh with -config, so it never lives in
# /etc/X11/xorg.conf.d, which the desktop's own server (:0) also reads.
#
# Two things matter for leaving :0 alone:
#   - no input devices are added, so your keyboard and mouse stay with :0.
#     /usr/share/X11/xorg.conf.d/40-libinput.conf is read by every server, and
#     would otherwise attach them here too;
#   - the server shares vt7 with :0 instead of switching to its own VT
#     (the start script passes vt7 -sharevts -novtswitch).

Section "Files"
    # 10-nvidia.conf sets this only for GPUs Xorg finds by itself. This file
    # names the GPU by BusID, so without it nvidia_drv.so would not be found.
    ModulePath "/usr/lib/x86_64-linux-gnu/nvidia/xorg"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices"     "false"
    Option "AutoEnableDevices"  "false"
    Option "AutoAddGPU"         "false"
    Option "AllowEmptyInput"    "true"
    Option "DontVTSwitch"       "true"
    Option "BlankTime"          "0"
    Option "StandbyTime"        "0"
    Option "SuspendTime"        "0"
    Option "OffTime"            "0"
EndSection

Section "ServerLayout"
    Identifier "uma-headless"
    Screen 0   "uma-screen"
EndSection

Section "Device"
    Identifier "uma-nvidia"
    Driver     "nvidia"
    # GTX 960M, from `nvidia-xconfig --query-gpu-info`.
    BusID      "PCI:1:0:0"
    # The laptop's NVIDIA GPU has no outputs of its own (0 display devices).
    Option     "AllowEmptyInitialConfiguration" "true"
    Option     "UseDisplayDevice" "none"
    Option     "ProbeAllGpus" "false"
    Option     "NoLogo" "true"
EndSection

Section "Screen"
    Identifier   "uma-screen"
    Device       "uma-nvidia"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        # Everything in the bot assumes 1920x1080.
        Virtual 1920 1080
    EndSubSection
EndSection
